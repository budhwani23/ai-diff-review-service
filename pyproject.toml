[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-diff-review-service"
version = "1.0.0"
description = "Asynchronous AI diff review service with deterministic and Cerebras providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "asyncer>=0.0.8",
  "fastapi[standard]>=0.128.0",
  "httpx>=0.28.0",
  "langchain>=1.2.0",
  "langchain-cerebras>=0.8.0",
  "langgraph>=1.0.0",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "ty>=0.0.1a6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python-version = "3.12"
